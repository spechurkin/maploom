[package]
name = "maploom"
# Generated from package.json by scripts/app-version.mjs; do not edit manually.
version = "1.0.1"
edition = "2024"
rust-version = "1.88"
description = "Open-source Dungeondraft analog"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-updater", "dep:open"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
anyhow = "1"
base64 = "0.22"
egui = "=0.32.3"
egui-wgpu = "=0.32.3"
wgpu = { version = "25", default-features = false, features = ["vulkan", "dx12", "metal", "webgpu", "wgsl"] }
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
i_overlay = "=4.4.1"
pollster = "0.4"
percent-encoding = "2"
rayon = "1.10"
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ttf-parser = "=0.25.1"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tauri = { version = "=2.11.5", optional = true, features = [] }
tauri-plugin-updater = { version = "=2.10.1", optional = true, default-features = false, features = ["rustls-tls"] }
open = { version = "5", optional = true }

[build-dependencies]
embed-resource = "=3.0.11"
tauri-build = { version = "=2.6.3", optional = true, features = [] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
debug = 1

[lints.rust]
unsafe_code = "forbid"
